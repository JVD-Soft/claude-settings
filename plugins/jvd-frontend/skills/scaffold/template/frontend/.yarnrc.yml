# Yarn 4. Yarn 1 is end-of-life and cannot install Vitest at all — its linker
# fails on `vite` as a peer even in an empty project.
#
# node-modules instead of Yarn's default PnP: PnP needs editor SDKs and
# per-tool patches, while node_modules is what Vite, ESLint and the Docker
# image already expect.
nodeLinker: node-modules
