# Content-Security-Policy — ТОЛЬКО для SPA.
#
# На /admin его вешать нельзя: Filament строится на Alpine и инлайновых
# скриптах, строгий script-src положит панель целиком.
#
# Политика написана под фактическую сборку, не по шаблону:
#   script-src 'self'   — в собранном HTML нет ни одного инлайнового <script>
#                         (modulePreload-полифилл отключён в vite.config.ts
#                         именно ради этой строки; уберёте — вернётся инлайн).
#   style-src unsafe-inline — react-hot-toast тянет goober, который вставляет
#                         <style> в рантайме. Без этого тосты без стилей.
#                         Для style-src это несопоставимо меньший риск, чем
#                         для script-src.
#   img-src data:       — svg-иконки и превью в data-URI.
#   connect-src 'self'  — API отдаётся тем же origin через этот же nginx.
#   frame-ancestors     — вместо X-Frame-Options, современный эквивалент.
#
# Внешних CDN, шрифтов и аналитики нет ни одного — если появятся, дописывать
# сюда придётся осознанно, и это правильная цена.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
