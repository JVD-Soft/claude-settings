# Заголовки, безопасные для всего, что отдаёт этот сервер, включая Filament.
#
# nginx НЕ наследует add_header в location, где объявлен свой add_header, —
# поэтому это сниппет, а не набор строк на уровне server: иначе блоки с
# Cache-Control молча теряли бы всю безопасность.

# Браузер не должен угадывать тип: подменённый .js, отданный как text/plain,
# иначе может исполниться.
add_header X-Content-Type-Options "nosniff" always;

# Реферер уходит только на свой origin: пути каталога с фильтрами не утекают
# на сторонние сайты по внешним ссылкам.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Приложению не нужно ничего из этого. Выключено явно, чтобы сторонний скрипт
# не смог запросить.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
