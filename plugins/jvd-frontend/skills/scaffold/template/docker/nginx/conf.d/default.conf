server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Server level, so it covers everything. nginx does NOT inherit add_header
    # into a location that declares one of its own — every location below that
    # sets a header has to include this again.
    include /etc/nginx/snippets/security-headers.conf;

    # 1. Статические файлы Laravel (CSS, JS, шрифты) - ВЫСШИЙ ПРИОРИТЕТ
    # Только для файлов в /css/, /js/, /fonts/, /vendor/ и корневых изображений
    location ~ ^/(css|js|fonts|vendor)/.*\.(css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        root /var/www/public;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Сначала Laravel public, затем сборка фронта, затем Vite. Без
    # @frontend_root корневые ассеты SPA (favicon, robots.txt, иконки PWA)
    # отдают 404: они в /app/dist, а не в /var/www/public.
    location ~ ^/[^/]+\.(png|jpg|jpeg|gif|ico|svg|webp|avif|webmanifest|txt|xml)$ {
        root /var/www/public;
        try_files $uri @frontend_root;
    }

    location @frontend_root {
        root /app/dist;
        try_files $uri @proxy;
    }

    # 2. Бэкенд (API и статика Laravel) - ДОЛЖЕН БЫТЬ ПЕРЕД ФРОНТЕНДОМ
    location ~ ^/(api|sanctum|storage|docs|horizon|admin|log-viewer|livewire|_debugbar) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Сборка кладёт sourcemap'ы рядом с ассетами (sourcemap: "hidden").
    # Они нужны, чтобы вытащить их из образа под стектрейс, а не отдавать наружу.
    location ~ \.map$ {
        deny all;
    }

    # Имена содержат хеш содержимого — кэшируются навсегда.
    location /assets/ {
        root /app/dist;
        try_files $uri @proxy;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Оболочки SPA не кэшируются никогда: иначе у браузера остаётся HTML со
    # ссылками на уже удалённые хеши ассетов.
    location ~ ^/(index\.html|app\.html|sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        root /app/dist;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        try_files $uri @proxy;
    }

    # Файл из /app/dist → /index.html (SPA-fallback) → Vite (dev).
    # НЕ убирать /index.html из try_files: без него любой вложенный маршрут
    # уходит в @proxy и отдаёт 502, потому что в production контейнер frontend
    # выполняет `yarn build && sleep infinity` и на 5173 никто не слушает.
    location / {
        root /app/dist;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        try_files $uri $uri/ /index.html @proxy;
    }

    location @proxy {
        resolver 127.0.0.11 valid=30s;
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Обработка PHP-файлов
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
